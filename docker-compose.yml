version: '3.8'
services:
  lego-editor:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: lego-3d-editor
    ports:
      - '3000:80'
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - lego-network
networks:
  lego-network:
    driver: bridge
